name: TRACE pace ML fixture tests
on:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/pace-ml.yml'
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/pace-ml.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt
      - run: cd ml && pytest -q test_pace_benchmark.py
